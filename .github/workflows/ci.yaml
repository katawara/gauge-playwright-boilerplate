name: CI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.ts"
      - "**.json"
      - "**.toml"
      - "**.yaml"
      - "**.properties"
      - ".github/workflows/**"
      - "!.vscode/**.json"
      - "!*.md"
jobs:
  lint-code:
    name: Lint code (use Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: "node pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Lint code
        run: pnpm check:ci:code

  lint-specs:
    name: Lint specs (use Gauge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: "node pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Lint Gauge specs
        run: pnpm check:specs

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: "node pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Compile
        run: pnpm compile

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: "node pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Audit dependencies
        run: pnpm audit

  e2e-health-check:
    name: E2E Health Check (use Gauge & Playwright)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: "node pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Run E2E health check
        run: pnpm e2e:ci:health-check
